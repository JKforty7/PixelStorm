<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — PixelStorm</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --neon-green: #39ff14;
    --neon-green-dim: #1a8a0a;
    --neon-cyan: #00f0ff;
    --card-bg: #12121a;
    --card-border: #1e1e2e;
    --grid-line: rgba(57, 255, 20, 0.04);
  }

  body {
    background: var(--bg);
    color: #e0e0e0;
    font-family: 'Chakra Petch', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
    pointer-events: none;
    z-index: 100;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(57, 255, 20, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57, 255, 20, 0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px 60px;
    width: 100%;
    max-width: 600px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    width: 100%;
  }

  .back-link {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #555;
    text-decoration: none;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--neon-green); }

  .title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(16px, 4vw, 22px);
    color: var(--neon-green);
    text-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
    flex: 1;
    text-align: center;
  }

  .score-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
  }

  .score-bar span { color: #666; }
  .score-bar .val { color: var(--neon-green); }
  .score-bar .hi { color: var(--neon-cyan); }

  .game-frame {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px;
    width: 100%;
    aspect-ratio: 1;
    max-width: 500px;
    position: relative;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 4px;
    image-rendering: pixelated;
  }

  .overlay {
    position: absolute;
    inset: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 15, 0.88);
    border-radius: 4px;
    z-index: 2;
    transition: opacity 0.3s;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    color: var(--neon-green);
    margin-bottom: 8px;
    text-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
  }

  .overlay-sub {
    font-size: 13px;
    color: #666;
    margin-bottom: 28px;
  }

  .overlay-score {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--neon-cyan);
    margin-bottom: 24px;
  }

  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--neon-green);
    border: 1px solid rgba(57, 255, 20, 0.3);
    background: transparent;
    padding: 12px 24px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: rgba(57, 255, 20, 0.1); }

  .controls-hint {
    margin-top: 16px;
    font-size: 12px;
    color: #444;
    text-align: center;
    line-height: 1.8;
  }

  .mobile-controls {
    display: none;
    margin-top: 16px;
    gap: 4px;
  }

  .d-btn {
    width: 54px;
    height: 54px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: #666;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .d-btn:active { background: rgba(57, 255, 20, 0.1); border-color: var(--neon-green-dim); color: var(--neon-green); }

  @media (max-width: 600px) {
    .mobile-controls { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 54px); justify-content: center; }
    .d-btn.up { grid-column: 2; grid-row: 1; }
    .d-btn.left { grid-column: 1; grid-row: 2; }
    .d-btn.down { grid-column: 2; grid-row: 2; }
    .d-btn.right { grid-column: 3; grid-row: 2; }
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="container">
  <div class="header">
    <a href="index.html" class="back-link">← BACK</a>
    <div class="title">SNAKE</div>
    <div style="width:52px"></div>
  </div>

  <div class="score-bar">
    <span>SCORE: <span class="val" id="score">0</span></span>
    <span>BEST: <span class="hi" id="hiscore">0</span></span>
  </div>

  <div class="game-frame">
    <canvas id="game"></canvas>
    <div class="overlay" id="startScreen">
      <div class="overlay-title">SNAKE</div>
      <div class="overlay-sub">Eat. Grow. Survive.</div>
      <button class="btn" onclick="startGame()">START</button>
    </div>
    <div class="overlay hidden" id="deathScreen">
      <div class="overlay-title">GAME OVER</div>
      <div class="overlay-score" id="finalScore">Score: 0</div>
      <button class="btn" onclick="startGame()">RETRY</button>
    </div>
  </div>

  <div class="controls-hint">
    Arrow keys or WASD to move<br>
    P to pause
  </div>

  <div class="mobile-controls">
    <button class="d-btn up" ontouchstart="setDir(0,-1)" onclick="setDir(0,-1)">▲</button>
    <button class="d-btn left" ontouchstart="setDir(-1,0)" onclick="setDir(-1,0)">◄</button>
    <button class="d-btn down" ontouchstart="setDir(0,1)" onclick="setDir(0,1)">▼</button>
    <button class="d-btn right" ontouchstart="setDir(1,0)" onclick="setDir(1,0)">►</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20;
let cols, rows, cellSize;
let snake, dir, nextDir, food, score, hiScore, running, paused, speed, loop;

hiScore = parseInt(localStorage.getItem('snake_hi') || '0');
document.getElementById('hiscore').textContent = hiScore;

function resize() {
  const frame = canvas.parentElement;
  const s = frame.clientWidth - 16;
  canvas.width = s;
  canvas.height = s;
  cellSize = Math.floor(s / GRID);
  cols = GRID;
  rows = GRID;
}
resize();
window.addEventListener('resize', resize);

function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('deathScreen').classList.add('hidden');
  snake = [{x: Math.floor(GRID/2), y: Math.floor(GRID/2)}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  speed = 120;
  paused = false;
  running = true;
  document.getElementById('score').textContent = '0';
  placeFood();
  clearInterval(loop);
  loop = setInterval(tick, speed);
}

function placeFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function tick() {
  if (paused || !running) return;
  dir = {...nextDir};
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    die();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    placeFood();
    if (speed > 60) {
      speed -= 2;
      clearInterval(loop);
      loop = setInterval(tick, speed);
    }
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = '#0d0d14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = 'rgba(57,255,20,0.03)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= cols; i++) {
    ctx.beginPath();
    ctx.moveTo(i * cellSize, 0);
    ctx.lineTo(i * cellSize, rows * cellSize);
    ctx.stroke();
  }
  for (let i = 0; i <= rows; i++) {
    ctx.beginPath();
    ctx.moveTo(0, i * cellSize);
    ctx.lineTo(cols * cellSize, i * cellSize);
    ctx.stroke();
  }

  // Food
  ctx.fillStyle = '#ff3366';
  ctx.shadowColor = '#ff3366';
  ctx.shadowBlur = 10;
  const fx = food.x * cellSize + cellSize * 0.15;
  const fy = food.y * cellSize + cellSize * 0.15;
  const fs = cellSize * 0.7;
  ctx.beginPath();
  ctx.roundRect(fx, fy, fs, fs, 3);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Snake
  snake.forEach((seg, i) => {
    const brightness = Math.max(0.4, 1 - i * 0.03);
    ctx.fillStyle = `rgba(57,255,20,${brightness})`;
    if (i === 0) {
      ctx.shadowColor = 'rgba(57,255,20,0.5)';
      ctx.shadowBlur = 8;
    }
    const sx = seg.x * cellSize + 1;
    const sy = seg.y * cellSize + 1;
    const ss = cellSize - 2;
    ctx.beginPath();
    ctx.roundRect(sx, sy, ss, ss, i === 0 ? 4 : 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}

function die() {
  running = false;
  clearInterval(loop);
  if (score > hiScore) {
    hiScore = score;
    localStorage.setItem('snake_hi', hiScore);
    document.getElementById('hiscore').textContent = hiScore;
  }
  document.getElementById('finalScore').textContent = 'Score: ' + score;
  document.getElementById('deathScreen').classList.remove('hidden');
}

function setDir(x, y) {
  if (dir.x === -x && dir.y === -y) return;
  nextDir = {x, y};
}

document.addEventListener('keydown', e => {
  switch(e.key) {
    case 'ArrowUp': case 'w': case 'W': e.preventDefault(); setDir(0, -1); break;
    case 'ArrowDown': case 's': case 'S': e.preventDefault(); setDir(0, 1); break;
    case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); setDir(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D': e.preventDefault(); setDir(1, 0); break;
    case 'p': case 'P': paused = !paused; break;
  }
});

// Initial draw
draw();
</script>
</body>
</html>
