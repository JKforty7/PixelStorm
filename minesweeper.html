<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper — PixelStorm</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --neon-purple: #b44aff;
    --neon-purple-dim: #6a2d99;
    --neon-cyan: #00f0ff;
    --card-bg: #12121a;
    --card-border: #1e1e2e;
  }

  body {
    background: var(--bg);
    color: #e0e0e0;
    font-family: 'Chakra Petch', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
    pointer-events: none;
    z-index: 100;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(180, 74, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(180, 74, 255, 0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px 60px;
    width: 100%;
    max-width: 600px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    width: 100%;
  }

  .back-link {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #555;
    text-decoration: none;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--neon-purple); }

  .title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 3.5vw, 20px);
    color: var(--neon-purple);
    text-shadow: 0 0 20px rgba(180, 74, 255, 0.3);
    flex: 1;
    text-align: center;
  }

  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
  }

  .info-bar span { color: #666; }
  .info-bar .val { color: var(--neon-purple); }
  .info-bar .hi { color: var(--neon-cyan); }
  .info-bar .mines-val { color: #ff3366; }

  .diff-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .diff-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #555;
    border: 1px solid var(--card-border);
    background: transparent;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .diff-btn:hover { color: var(--neon-purple); border-color: var(--neon-purple-dim); }
  .diff-btn.active { color: var(--neon-purple); border-color: var(--neon-purple); background: rgba(180,74,255,0.08); }

  .game-frame {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px;
    width: 100%;
    max-width: 500px;
    position: relative;
  }

  .board {
    display: grid;
    gap: 2px;
    width: 100%;
    user-select: none;
    -webkit-user-select: none;
  }

  .cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px, 2.5vw, 13px);
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.1s;
  }

  .cell.hidden {
    background: #1c1c2a;
    border: 1px solid #2a2a3d;
  }
  .cell.hidden:hover {
    background: #26263a;
    border-color: rgba(180,74,255,0.3);
  }

  .cell.revealed {
    background: #0f0f18;
    border: 1px solid #1a1a28;
    cursor: default;
  }

  .cell.flagged {
    background: #1c1c2a;
    border: 1px solid rgba(255,51,102,0.3);
  }

  .cell.mine-hit {
    background: rgba(255,51,102,0.15);
    border: 1px solid rgba(255,51,102,0.4);
  }

  .cell.mine-show {
    background: #0f0f18;
    border: 1px solid #1a1a28;
  }

  .n1 { color: #4488ff; }
  .n2 { color: #39ff14; }
  .n3 { color: #ff3366; }
  .n4 { color: #b44aff; }
  .n5 { color: #ff6a00; }
  .n6 { color: #00f0ff; }
  .n7 { color: #e0e0e0; }
  .n8 { color: #888; }

  .overlay {
    position: absolute;
    inset: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 15, 0.88);
    border-radius: 4px;
    z-index: 2;
    transition: opacity 0.3s;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    margin-bottom: 8px;
    text-shadow: 0 0 15px rgba(180, 74, 255, 0.4);
  }

  .overlay-title.win { color: #39ff14; }
  .overlay-title.lose { color: #ff3366; }

  .overlay-sub {
    font-size: 13px;
    color: #666;
    margin-bottom: 24px;
    text-align: center;
    line-height: 1.6;
  }

  .overlay-score {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--neon-cyan);
    margin-bottom: 24px;
  }

  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--neon-purple);
    border: 1px solid rgba(180, 74, 255, 0.3);
    background: transparent;
    padding: 12px 24px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: rgba(180, 74, 255, 0.1); }

  .controls-hint {
    margin-top: 16px;
    font-size: 12px;
    color: #444;
    text-align: center;
    line-height: 1.8;
  }

  .flag-toggle {
    margin-top: 12px;
    display: none;
    gap: 8px;
    align-items: center;
  }

  .flag-toggle-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    padding: 10px 18px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid var(--card-border);
    background: transparent;
    color: #666;
    transition: all 0.2s;
  }
  .flag-toggle-btn.active {
    color: #ff3366;
    border-color: rgba(255,51,102,0.4);
    background: rgba(255,51,102,0.08);
  }

  @media (max-width: 600px) {
    .flag-toggle { display: flex; }
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="container">
  <div class="header">
    <a href="index.html" class="back-link">← BACK</a>
    <div class="title">MINESWEEPER</div>
    <div style="width:52px"></div>
  </div>

  <div class="diff-bar">
    <button class="diff-btn active" onclick="setDifficulty(0)" id="d0">EASY</button>
    <button class="diff-btn" onclick="setDifficulty(1)" id="d1">MEDIUM</button>
    <button class="diff-btn" onclick="setDifficulty(2)" id="d2">HARD</button>
  </div>

  <div class="info-bar">
    <span>MINES: <span class="mines-val" id="mineCount">10</span></span>
    <span>TIME: <span class="val" id="timer">0:00</span></span>
    <span>BEST: <span class="hi" id="bestTime">--:--</span></span>
  </div>

  <div class="game-frame">
    <div class="board" id="board"></div>
    <div class="overlay hidden" id="winScreen">
      <div class="overlay-title win">CLEARED!</div>
      <div class="overlay-score" id="winTime">Time: 0:00</div>
      <button class="btn" onclick="newGame()">PLAY AGAIN</button>
    </div>
    <div class="overlay hidden" id="loseScreen">
      <div class="overlay-title lose">BOOM!</div>
      <div class="overlay-sub">You hit a mine.</div>
      <button class="btn" onclick="newGame()">RETRY</button>
    </div>
  </div>

  <div class="controls-hint">
    Click to reveal &nbsp;|&nbsp; Right-click to flag
  </div>

  <div class="flag-toggle">
    <button class="flag-toggle-btn" id="flagBtn" onclick="toggleFlagMode()">FLAG MODE: OFF</button>
  </div>
</div>

<script>
const DIFFICULTIES = [
  { rows: 9, cols: 9, mines: 10, key: 'mine_easy' },
  { rows: 12, cols: 12, mines: 25, key: 'mine_med' },
  { rows: 16, cols: 16, mines: 50, key: 'mine_hard' },
];

let diff = 0;
let grid, rows, cols, mineCount, revealed, flagged, gameOver, gameStarted, firstClick;
let timerInterval, elapsed;
let flagMode = false;

function setDifficulty(d) {
  diff = d;
  document.querySelectorAll('.diff-btn').forEach((b, i) => b.classList.toggle('active', i === d));
  loadBest();
  newGame();
}

function loadBest() {
  let best = localStorage.getItem(DIFFICULTIES[diff].key);
  document.getElementById('bestTime').textContent = best ? formatTime(parseInt(best)) : '--:--';
}

function formatTime(s) {
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function newGame() {
  const d = DIFFICULTIES[diff];
  rows = d.rows;
  cols = d.cols;
  mineCount = d.mines;
  gameOver = false;
  gameStarted = false;
  firstClick = true;
  revealed = 0;
  flagged = 0;
  elapsed = 0;
  clearInterval(timerInterval);

  document.getElementById('timer').textContent = '0:00';
  document.getElementById('mineCount').textContent = mineCount;
  document.getElementById('winScreen').classList.add('hidden');
  document.getElementById('loseScreen').classList.add('hidden');

  // Init grid
  grid = [];
  for (let r = 0; r < rows; r++) {
    grid[r] = [];
    for (let c = 0; c < cols; c++) {
      grid[r][c] = { mine: false, revealed: false, flagged: false, count: 0 };
    }
  }

  renderBoard();
  loadBest();
}

function placeMines(safeR, safeC) {
  let placed = 0;
  while (placed < mineCount) {
    let r = Math.floor(Math.random() * rows);
    let c = Math.floor(Math.random() * cols);
    if (grid[r][c].mine) continue;
    if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
    grid[r][c].mine = true;
    placed++;
  }
  // Count neighbors
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c].mine) continue;
      let count = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          let nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].mine) count++;
        }
      }
      grid[r][c].count = count;
    }
  }
}

function renderBoard() {
  const board = document.getElementById('board');
  board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  board.innerHTML = '';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell hidden';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener('click', () => onCellClick(r, c));
      cell.addEventListener('contextmenu', e => { e.preventDefault(); toggleFlag(r, c); });
      board.appendChild(cell);
    }
  }
}

function getCellEl(r, c) {
  return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
}

function onCellClick(r, c) {
  if (gameOver) return;
  if (flagMode) { toggleFlag(r, c); return; }

  const cell = grid[r][c];
  if (cell.revealed || cell.flagged) return;

  if (firstClick) {
    firstClick = false;
    placeMines(r, c);
    gameStarted = true;
    timerInterval = setInterval(() => {
      elapsed++;
      document.getElementById('timer').textContent = formatTime(elapsed);
    }, 1000);
  }

  if (cell.mine) {
    lose(r, c);
    return;
  }

  reveal(r, c);
  checkWin();
}

function reveal(r, c) {
  const cell = grid[r][c];
  if (cell.revealed || cell.flagged || cell.mine) return;
  cell.revealed = true;
  revealed++;

  const el = getCellEl(r, c);
  el.className = 'cell revealed';
  if (cell.count > 0) {
    el.textContent = cell.count;
    el.classList.add('n' + cell.count);
  }

  if (cell.count === 0) {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        let nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) reveal(nr, nc);
      }
    }
  }
}

function toggleFlag(r, c) {
  if (gameOver) return;
  const cell = grid[r][c];
  if (cell.revealed) return;

  cell.flagged = !cell.flagged;
  flagged += cell.flagged ? 1 : -1;
  const el = getCellEl(r, c);

  if (cell.flagged) {
    el.className = 'cell flagged';
    el.textContent = '⚑';
    el.style.color = '#ff3366';
  } else {
    el.className = 'cell hidden';
    el.textContent = '';
    el.style.color = '';
  }
  document.getElementById('mineCount').textContent = mineCount - flagged;
}

function lose(hitR, hitC) {
  gameOver = true;
  clearInterval(timerInterval);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c].mine) {
        const el = getCellEl(r, c);
        if (r === hitR && c === hitC) {
          el.className = 'cell mine-hit';
          el.textContent = '✦';
          el.style.color = '#ff3366';
        } else {
          el.className = 'cell mine-show';
          el.textContent = '✦';
          el.style.color = '#666';
        }
      }
    }
  }

  setTimeout(() => {
    document.getElementById('loseScreen').classList.remove('hidden');
  }, 400);
}

function checkWin() {
  let total = rows * cols;
  if (revealed === total - mineCount) {
    gameOver = true;
    clearInterval(timerInterval);

    // Auto-flag remaining
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (grid[r][c].mine && !grid[r][c].flagged) {
          const el = getCellEl(r, c);
          el.className = 'cell flagged';
          el.textContent = '⚑';
          el.style.color = '#39ff14';
        }
      }
    }
    document.getElementById('mineCount').textContent = '0';

    // Save best
    let bestKey = DIFFICULTIES[diff].key;
    let prev = localStorage.getItem(bestKey);
    if (!prev || elapsed < parseInt(prev)) {
      localStorage.setItem(bestKey, elapsed);
    }
    loadBest();

    document.getElementById('winTime').textContent = 'Time: ' + formatTime(elapsed);
    setTimeout(() => {
      document.getElementById('winScreen').classList.remove('hidden');
    }, 300);
  }
}

function toggleFlagMode() {
  flagMode = !flagMode;
  const btn = document.getElementById('flagBtn');
  btn.textContent = 'FLAG MODE: ' + (flagMode ? 'ON' : 'OFF');
  btn.classList.toggle('active', flagMode);
}

newGame();
</script>
</body>
</html>
