<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelStorm</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --neon-cyan: #00f0ff;
    --neon-magenta: #ff00aa;
    --neon-yellow: #ffe600;
    --card-bg: #12121a;
    --card-border: #1e1e2e;
  }

  body {
    background: var(--bg);
    color: #e0e0e0;
    font-family: 'Chakra Petch', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.08) 2px,
      rgba(0, 0, 0, 0.08) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* Animated background grid */
  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridScroll 20s linear infinite;
    z-index: 0;
  }

  @keyframes gridScroll {
    0% { transform: translate(0, 0); }
    100% { transform: translate(40px, 40px); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 60px 24px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Logo */
  .logo {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(28px, 6vw, 48px);
    text-align: center;
    margin-bottom: 12px;
    animation: logoGlow 3s ease-in-out infinite alternate;
  }

  .logo .pixel { color: var(--neon-cyan); }
  .logo .storm { color: var(--neon-magenta); }

  @keyframes logoGlow {
    0% {
      text-shadow:
        0 0 10px rgba(0, 240, 255, 0.4),
        0 0 30px rgba(0, 240, 255, 0.15);
    }
    100% {
      text-shadow:
        0 0 15px rgba(255, 0, 170, 0.4),
        0 0 40px rgba(255, 0, 170, 0.15);
    }
  }

  .tagline {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 60px;
    text-align: center;
  }

  /* Game cards */
  .games {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    width: 100%;
  }

  .game-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 32px 28px;
    text-decoration: none;
    color: #e0e0e0;
    position: relative;
    overflow: hidden;
    transition: transform 0.25s ease, border-color 0.3s ease;
  }

  .game-card:hover {
    transform: translateY(-4px);
  }

  .game-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 3px;
    transition: opacity 0.3s ease;
  }

  .game-card.shooter::before { background: var(--neon-cyan); }
  .game-card.shooter:hover { border-color: rgba(0, 240, 255, 0.3); }

  .game-card.tictactoe::before { background: var(--neon-magenta); }
  .game-card.tictactoe:hover { border-color: rgba(255, 0, 170, 0.3); }

  .game-icon {
    font-size: 36px;
    margin-bottom: 16px;
    display: block;
  }

  .game-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    margin-bottom: 12px;
    line-height: 1.6;
  }

  .shooter .game-title { color: var(--neon-cyan); }
  .tictactoe .game-title { color: var(--neon-magenta); }

  .game-desc {
    font-size: 14px;
    color: #888;
    line-height: 1.6;
  }

  .play-label {
    display: inline-block;
    margin-top: 20px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 8px 16px;
    border-radius: 4px;
    transition: background 0.2s ease;
  }

  .shooter .play-label {
    color: var(--neon-cyan);
    border: 1px solid rgba(0, 240, 255, 0.3);
  }
  .shooter:hover .play-label {
    background: rgba(0, 240, 255, 0.1);
  }

  .tictactoe .play-label {
    color: var(--neon-magenta);
    border: 1px solid rgba(255, 0, 170, 0.3);
  }
  .tictactoe:hover .play-label {
    background: rgba(255, 0, 170, 0.1);
  }

  /* Footer */
  .footer {
    margin-top: 80px;
    font-size: 12px;
    color: #333;
    text-align: center;
    letter-spacing: 1px;
  }

  /* Entrance animation */
  .game-card {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.5s ease forwards;
  }
  .game-card:nth-child(1) { animation-delay: 0.2s; }
  .game-card:nth-child(2) { animation-delay: 0.35s; }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="container">
    <h1 class="logo"><span class="pixel">Pixel</span><span class="storm">Storm</span></h1>
    <p class="tagline">Browser-based retro games</p>

    <div class="games">
      <a href="shooter.html" class="game-card shooter">
        <span class="game-icon">🔫</span>
        <div class="game-title">Pixel Storm Shooter</div>
        <div class="game-desc">Top-down 2D shooter. Survive waves of enemies in retro pixel style.</div>
        <span class="play-label">▶ PLAY</span>
      </a>

      <a href="tictactoe.html" class="game-card tictactoe">
        <span class="game-icon">⭕</span>
        <div class="game-title">Tic Tac Toe</div>
        <div class="game-desc">The classic strategy game. Challenge a friend or test your wits.</div>
        <span class="play-label">▶ PLAY</span>
      </a>
    </div>

    <div class="footer">PIXELSTORM © 2026</div>
  </div>
</body>
</html>
