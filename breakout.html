<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout — PixelStorm</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --neon-orange: #ff6a00;
    --neon-orange-dim: #993f00;
    --neon-cyan: #00f0ff;
    --card-bg: #12121a;
    --card-border: #1e1e2e;
  }

  body {
    background: var(--bg);
    color: #e0e0e0;
    font-family: 'Chakra Petch', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
    pointer-events: none;
    z-index: 100;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 106, 0, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 106, 0, 0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px 60px;
    width: 100%;
    max-width: 600px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    width: 100%;
  }

  .back-link {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #555;
    text-decoration: none;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--neon-orange); }

  .title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(16px, 4vw, 22px);
    color: var(--neon-orange);
    text-shadow: 0 0 20px rgba(255, 106, 0, 0.3);
    flex: 1;
    text-align: center;
  }

  .score-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
  }

  .score-bar span { color: #666; }
  .score-bar .val { color: var(--neon-orange); }
  .score-bar .hi { color: var(--neon-cyan); }
  .score-bar .lives-val { color: #ff3366; }

  .game-frame {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px;
    width: 100%;
    max-width: 500px;
    position: relative;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 4px;
  }

  .overlay {
    position: absolute;
    inset: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 15, 0.88);
    border-radius: 4px;
    z-index: 2;
    transition: opacity 0.3s;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    color: var(--neon-orange);
    margin-bottom: 8px;
    text-shadow: 0 0 15px rgba(255, 106, 0, 0.4);
  }

  .overlay-sub {
    font-size: 13px;
    color: #666;
    margin-bottom: 28px;
    text-align: center;
    line-height: 1.6;
  }

  .overlay-score {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--neon-cyan);
    margin-bottom: 24px;
  }

  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--neon-orange);
    border: 1px solid rgba(255, 106, 0, 0.3);
    background: transparent;
    padding: 12px 24px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: rgba(255, 106, 0, 0.1); }

  .controls-hint {
    margin-top: 16px;
    font-size: 12px;
    color: #444;
    text-align: center;
    line-height: 1.8;
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="container">
  <div class="header">
    <a href="index.html" class="back-link">← BACK</a>
    <div class="title">BREAKOUT</div>
    <div style="width:52px"></div>
  </div>

  <div class="score-bar">
    <span>SCORE: <span class="val" id="score">0</span></span>
    <span>LIVES: <span class="lives-val" id="lives">3</span></span>
    <span>BEST: <span class="hi" id="hiscore">0</span></span>
  </div>

  <div class="game-frame">
    <canvas id="game"></canvas>
    <div class="overlay" id="startScreen">
      <div class="overlay-title">BREAKOUT</div>
      <div class="overlay-sub">Smash all the bricks.<br>Don't let the ball drop.</div>
      <button class="btn" onclick="startGame()">START</button>
    </div>
    <div class="overlay hidden" id="deathScreen">
      <div class="overlay-title">GAME OVER</div>
      <div class="overlay-score" id="finalScore">Score: 0</div>
      <button class="btn" onclick="startGame()">RETRY</button>
    </div>
    <div class="overlay hidden" id="winScreen">
      <div class="overlay-title">YOU WIN!</div>
      <div class="overlay-score" id="winScore">Score: 0</div>
      <button class="btn" onclick="startGame()">PLAY AGAIN</button>
    </div>
  </div>

  <div class="controls-hint">
    Mouse or Arrow keys to move paddle<br>
    Touch and drag on mobile
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, scale;
const LOGIC_W = 400;
const LOGIC_H = 500;

function resize() {
  const frame = canvas.parentElement;
  const w = frame.clientWidth - 16;
  const h = w * (LOGIC_H / LOGIC_W);
  canvas.width = w;
  canvas.height = h;
  W = w;
  H = h;
  scale = w / LOGIC_W;
}
resize();
window.addEventListener('resize', () => { resize(); if (!running) drawStatic(); });

const BRICK_ROWS = 6;
const BRICK_COLS = 8;
const BRICK_PAD = 4;
const PADDLE_W = 60;
const PADDLE_H = 10;
const BALL_R = 5;

const ROW_COLORS = [
  '#ff3366', '#ff3366',
  '#ff6a00', '#ff6a00',
  '#ffe600', '#ffe600',
];
const ROW_GLOW = [
  'rgba(255,51,102,0.5)',
  'rgba(255,51,102,0.5)',
  'rgba(255,106,0,0.5)',
  'rgba(255,106,0,0.5)',
  'rgba(255,230,0,0.4)',
  'rgba(255,230,0,0.4)',
];
const ROW_POINTS = [7, 7, 5, 5, 3, 3];

let bricks, paddle, ball, score, lives, hiScore, running, animFrame;
let keysDown = {};

hiScore = parseInt(localStorage.getItem('breakout_hi') || '0');
document.getElementById('hiscore').textContent = hiScore;

function initBricks() {
  bricks = [];
  const bw = (LOGIC_W - BRICK_PAD * (BRICK_COLS + 1)) / BRICK_COLS;
  const bh = 14;
  const topOff = 50;
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      bricks.push({
        x: BRICK_PAD + c * (bw + BRICK_PAD),
        y: topOff + r * (bh + BRICK_PAD),
        w: bw,
        h: bh,
        alive: true,
        color: ROW_COLORS[r],
        glow: ROW_GLOW[r],
        points: ROW_POINTS[r],
      });
    }
  }
}

function resetBall() {
  ball = {
    x: LOGIC_W / 2,
    y: LOGIC_H - 50,
    dx: (Math.random() > 0.5 ? 1 : -1) * 3,
    dy: -3,
    r: BALL_R,
    speed: 3,
  };
}

function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('deathScreen').classList.add('hidden');
  document.getElementById('winScreen').classList.add('hidden');
  score = 0;
  lives = 3;
  document.getElementById('score').textContent = '0';
  document.getElementById('lives').textContent = '3';
  paddle = { x: LOGIC_W / 2 - PADDLE_W / 2, y: LOGIC_H - 28, w: PADDLE_W, h: PADDLE_H };
  initBricks();
  resetBall();
  running = true;
  cancelAnimationFrame(animFrame);
  loop();
}

function loop() {
  if (!running) return;
  update();
  draw();
  animFrame = requestAnimationFrame(loop);
}

function update() {
  // Paddle keyboard
  if (keysDown['ArrowLeft'] || keysDown['a'] || keysDown['A']) paddle.x -= 5;
  if (keysDown['ArrowRight'] || keysDown['d'] || keysDown['D']) paddle.x += 5;
  paddle.x = Math.max(0, Math.min(LOGIC_W - paddle.w, paddle.x));

  // Ball movement
  ball.x += ball.dx;
  ball.y += ball.dy;

  // Wall bounces
  if (ball.x - ball.r <= 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
  if (ball.x + ball.r >= LOGIC_W) { ball.x = LOGIC_W - ball.r; ball.dx = -Math.abs(ball.dx); }
  if (ball.y - ball.r <= 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

  // Paddle bounce
  if (ball.dy > 0 &&
      ball.y + ball.r >= paddle.y &&
      ball.y + ball.r <= paddle.y + paddle.h + 4 &&
      ball.x >= paddle.x &&
      ball.x <= paddle.x + paddle.w) {
    let hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
    let angle = hit * (Math.PI / 3);
    ball.dx = ball.speed * Math.sin(angle);
    ball.dy = -ball.speed * Math.cos(angle);
    ball.y = paddle.y - ball.r;

    // Speed up slightly over time
    if (ball.speed < 5.5) ball.speed += 0.05;
  }

  // Ball falls below
  if (ball.y - ball.r > LOGIC_H) {
    lives--;
    document.getElementById('lives').textContent = lives;
    if (lives <= 0) {
      gameOver();
      return;
    }
    resetBall();
  }

  // Brick collision
  for (let b of bricks) {
    if (!b.alive) continue;
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
        ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
      b.alive = false;
      score += b.points;
      document.getElementById('score').textContent = score;

      // Determine bounce side
      let overlapLeft = (ball.x + ball.r) - b.x;
      let overlapRight = (b.x + b.w) - (ball.x - ball.r);
      let overlapTop = (ball.y + ball.r) - b.y;
      let overlapBottom = (b.y + b.h) - (ball.y - ball.r);
      let minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

      if (minOverlap === overlapTop || minOverlap === overlapBottom) {
        ball.dy = -ball.dy;
      } else {
        ball.dx = -ball.dx;
      }
      break;
    }
  }

  // Win check
  if (bricks.every(b => !b.alive)) {
    win();
  }
}

function draw() {
  const s = scale;
  ctx.fillStyle = '#0d0d14';
  ctx.fillRect(0, 0, W, H);

  // Bricks
  for (let b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.glow;
    ctx.shadowBlur = 6 * s;
    ctx.beginPath();
    ctx.roundRect(b.x * s, b.y * s, b.w * s, b.h * s, 2 * s);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Paddle
  ctx.fillStyle = '#e0e0e0';
  ctx.shadowColor = 'rgba(224,224,224,0.3)';
  ctx.shadowBlur = 8 * s;
  ctx.beginPath();
  ctx.roundRect(paddle.x * s, paddle.y * s, paddle.w * s, paddle.h * s, 4 * s);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Ball
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(255,255,255,0.6)';
  ctx.shadowBlur = 10 * s;
  ctx.beginPath();
  ctx.arc(ball.x * s, ball.y * s, ball.r * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawStatic() {
  const s = scale;
  ctx.fillStyle = '#0d0d14';
  ctx.fillRect(0, 0, W, H);
}

function gameOver() {
  running = false;
  cancelAnimationFrame(animFrame);
  if (score > hiScore) {
    hiScore = score;
    localStorage.setItem('breakout_hi', hiScore);
    document.getElementById('hiscore').textContent = hiScore;
  }
  document.getElementById('finalScore').textContent = 'Score: ' + score;
  document.getElementById('deathScreen').classList.remove('hidden');
}

function win() {
  running = false;
  cancelAnimationFrame(animFrame);
  if (score > hiScore) {
    hiScore = score;
    localStorage.setItem('breakout_hi', hiScore);
    document.getElementById('hiscore').textContent = hiScore;
  }
  document.getElementById('winScore').textContent = 'Score: ' + score;
  document.getElementById('winScreen').classList.remove('hidden');
}

// Input
document.addEventListener('keydown', e => {
  keysDown[e.key] = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keysDown[e.key] = false; });

// Mouse
canvas.addEventListener('mousemove', e => {
  if (!running) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / scale;
  paddle.x = mx - paddle.w / 2;
  paddle.x = Math.max(0, Math.min(LOGIC_W - paddle.w, paddle.x));
});

// Touch
canvas.addEventListener('touchmove', e => {
  if (!running) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const tx = (e.touches[0].clientX - rect.left) / scale;
  paddle.x = tx - paddle.w / 2;
  paddle.x = Math.max(0, Math.min(LOGIC_W - paddle.w, paddle.x));
}, { passive: false });

drawStatic();
</script>
</body>
</html>
