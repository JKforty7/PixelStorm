<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids — PixelStorm</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --neon-blue: #4488ff;
    --neon-blue-dim: #2255aa;
    --neon-cyan: #00f0ff;
    --card-bg: #12121a;
    --card-border: #1e1e2e;
  }

  body {
    background: var(--bg);
    color: #e0e0e0;
    font-family: 'Chakra Petch', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
    pointer-events: none;
    z-index: 100;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(68, 136, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(68, 136, 255, 0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px 60px;
    width: 100%;
    max-width: 600px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    width: 100%;
  }

  .back-link {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #555;
    text-decoration: none;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--neon-blue); }

  .title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(16px, 4vw, 22px);
    color: var(--neon-blue);
    text-shadow: 0 0 20px rgba(68, 136, 255, 0.3);
    flex: 1;
    text-align: center;
  }

  .score-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
  }

  .score-bar span { color: #666; }
  .score-bar .val { color: var(--neon-blue); }
  .score-bar .hi { color: var(--neon-cyan); }
  .score-bar .lives-val { color: #ff3366; }

  .game-frame {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px;
    width: 100%;
    max-width: 500px;
    position: relative;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 4px;
  }

  .overlay {
    position: absolute;
    inset: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 15, 0.88);
    border-radius: 4px;
    z-index: 2;
    transition: opacity 0.3s;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    color: var(--neon-blue);
    margin-bottom: 8px;
    text-shadow: 0 0 15px rgba(68, 136, 255, 0.4);
  }

  .overlay-sub {
    font-size: 13px;
    color: #666;
    margin-bottom: 28px;
    text-align: center;
    line-height: 1.6;
  }

  .overlay-score {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--neon-cyan);
    margin-bottom: 24px;
  }

  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--neon-blue);
    border: 1px solid rgba(68, 136, 255, 0.3);
    background: transparent;
    padding: 12px 24px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: rgba(68, 136, 255, 0.1); }

  .controls-hint {
    margin-top: 16px;
    font-size: 12px;
    color: #444;
    text-align: center;
    line-height: 1.8;
  }

  .mobile-controls {
    display: none;
    margin-top: 16px;
    gap: 4px;
  }

  .d-btn {
    width: 54px;
    height: 54px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: #666;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .d-btn:active { background: rgba(68, 136, 255, 0.1); border-color: var(--neon-blue-dim); color: var(--neon-blue); }

  @media (max-width: 600px) {
    .mobile-controls {
      display: grid;
      grid-template-columns: repeat(4, 54px);
      grid-template-rows: 54px;
      justify-content: center;
    }
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="container">
  <div class="header">
    <a href="index.html" class="back-link">← BACK</a>
    <div class="title">ASTEROIDS</div>
    <div style="width:52px"></div>
  </div>

  <div class="score-bar">
    <span>SCORE: <span class="val" id="score">0</span></span>
    <span>LIVES: <span class="lives-val" id="lives">3</span></span>
    <span>BEST: <span class="hi" id="hiscore">0</span></span>
  </div>

  <div class="game-frame">
    <canvas id="game"></canvas>
    <div class="overlay" id="startScreen">
      <div class="overlay-title">ASTEROIDS</div>
      <div class="overlay-sub">Blast rocks. Don't get hit.<br>They split when you shoot them.</div>
      <button class="btn" onclick="startGame()">START</button>
    </div>
    <div class="overlay hidden" id="deathScreen">
      <div class="overlay-title">GAME OVER</div>
      <div class="overlay-score" id="finalScore">Score: 0</div>
      <button class="btn" onclick="startGame()">RETRY</button>
    </div>
  </div>

  <div class="controls-hint">
    WASD / Arrow Keys to move &nbsp;|&nbsp; Space to shoot
  </div>

  <div class="mobile-controls">
    <button class="d-btn" ontouchstart="mobileKey('ArrowLeft',true)" ontouchend="mobileKey('ArrowLeft',false)">◄</button>
    <button class="d-btn" ontouchstart="mobileKey('ArrowUp',true)" ontouchend="mobileKey('ArrowUp',false)">▲</button>
    <button class="d-btn" ontouchstart="mobileKey(' ',true)" ontouchend="mobileKey(' ',false)">●</button>
    <button class="d-btn" ontouchstart="mobileKey('ArrowRight',true)" ontouchend="mobileKey('ArrowRight',false)">►</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const LW = 500, LH = 500;
let W, H, scale;

function resize() {
  const frame = canvas.parentElement;
  const w = frame.clientWidth - 16;
  canvas.width = w;
  canvas.height = w;
  W = w; H = w;
  scale = w / LW;
}
resize();
window.addEventListener('resize', resize);

let ship, asteroids, bullets, particles, score, lives, hiScore, running, animFrame, wave;
let keys = {};
let invincibleTimer = 0;
let shootCooldown = 0;

hiScore = parseInt(localStorage.getItem('asteroids_hi') || '0');
document.getElementById('hiscore').textContent = hiScore;

function mobileKey(key, down) { keys[key] = down; }

class Ship {
  constructor() {
    this.x = LW / 2;
    this.y = LH / 2;
    this.angle = -Math.PI / 2;
    this.dx = 0;
    this.dy = 0;
    this.thrusting = false;
  }
  update() {
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) this.angle -= 0.06;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) this.angle += 0.06;
    this.thrusting = keys['ArrowUp'] || keys['w'] || keys['W'];
    if (this.thrusting) {
      this.dx += Math.cos(this.angle) * 0.12;
      this.dy += Math.sin(this.angle) * 0.12;
    }
    // Friction
    this.dx *= 0.992;
    this.dy *= 0.992;
    let spd = Math.sqrt(this.dx*this.dx + this.dy*this.dy);
    if (spd > 5) { this.dx *= 5/spd; this.dy *= 5/spd; }
    this.x += this.dx;
    this.y += this.dy;
    // Wrap
    if (this.x < 0) this.x += LW;
    if (this.x > LW) this.x -= LW;
    if (this.y < 0) this.y += LH;
    if (this.y > LH) this.y -= LH;
  }
  draw() {
    const s = scale;
    ctx.save();
    ctx.translate(this.x * s, this.y * s);
    ctx.rotate(this.angle);

    let alpha = 1;
    if (invincibleTimer > 0) alpha = Math.sin(invincibleTimer * 10) > 0 ? 0.8 : 0.2;

    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#4488ff';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = 'rgba(68,136,255,0.5)';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(14 * s / LW * 100, 0);
    ctx.lineTo(-8 * s / LW * 100, -7 * s / LW * 100);
    ctx.lineTo(-4 * s / LW * 100, 0);
    ctx.lineTo(-8 * s / LW * 100, 7 * s / LW * 100);
    ctx.closePath();
    ctx.stroke();

    // Thrust flame
    if (this.thrusting) {
      ctx.strokeStyle = '#ff6a00';
      ctx.shadowColor = 'rgba(255,106,0,0.6)';
      ctx.beginPath();
      ctx.moveTo(-5 * s / LW * 100, -3 * s / LW * 100);
      ctx.lineTo(-12 * s / LW * 100 - Math.random() * 3 * s / LW * 100, 0);
      ctx.lineTo(-5 * s / LW * 100, 3 * s / LW * 100);
      ctx.stroke();
    }

    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

class Asteroid {
  constructor(x, y, size) {
    this.x = x;
    this.y = y;
    this.size = size; // 3=large, 2=medium, 1=small
    this.r = [40, 22, 12][3 - size];
    let angle = Math.random() * Math.PI * 2;
    let speed = (1.0 + Math.random()) * (4 - size) * 0.4;
    this.dx = Math.cos(angle) * speed;
    this.dy = Math.sin(angle) * speed;
    this.rot = 0;
    this.rotSpeed = (Math.random() - 0.5) * 0.03;
    // Generate jagged shape
    this.verts = [];
    let pts = 8 + Math.floor(Math.random() * 5);
    for (let i = 0; i < pts; i++) {
      let a = (i / pts) * Math.PI * 2;
      let jag = this.r * (0.7 + Math.random() * 0.4);
      this.verts.push({ a, d: jag });
    }
  }
  update() {
    this.x += this.dx;
    this.y += this.dy;
    this.rot += this.rotSpeed;
    if (this.x < -this.r) this.x += LW + this.r * 2;
    if (this.x > LW + this.r) this.x -= LW + this.r * 2;
    if (this.y < -this.r) this.y += LH + this.r * 2;
    if (this.y > LH + this.r) this.y -= LH + this.r * 2;
  }
  draw() {
    const s = scale;
    ctx.save();
    ctx.translate(this.x * s, this.y * s);
    ctx.rotate(this.rot);
    ctx.strokeStyle = 'rgba(200,200,200,0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < this.verts.length; i++) {
      let v = this.verts[i];
      let px = Math.cos(v.a) * v.d * s;
      let py = Math.sin(v.a) * v.d * s;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
}

class Bullet {
  constructor(x, y, angle) {
    this.x = x;
    this.y = y;
    let spd = 7;
    this.dx = Math.cos(angle) * spd;
    this.dy = Math.sin(angle) * spd;
    this.life = 55;
  }
  update() {
    this.x += this.dx;
    this.y += this.dy;
    this.life--;
    if (this.x < 0) this.x += LW;
    if (this.x > LW) this.x -= LW;
    if (this.y < 0) this.y += LH;
    if (this.y > LH) this.y -= LH;
  }
  draw() {
    const s = scale;
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(255,255,255,0.8)';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(this.x * s, this.y * s, 2 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    let angle = Math.random() * Math.PI * 2;
    let spd = 0.5 + Math.random() * 2.5;
    this.dx = Math.cos(angle) * spd;
    this.dy = Math.sin(angle) * spd;
    this.life = 20 + Math.random() * 20;
    this.maxLife = this.life;
    this.color = color;
  }
  update() {
    this.x += this.dx;
    this.y += this.dy;
    this.dx *= 0.97;
    this.dy *= 0.97;
    this.life--;
  }
  draw() {
    const s = scale;
    let alpha = this.life / this.maxLife;
    ctx.fillStyle = this.color;
    ctx.globalAlpha = alpha;
    ctx.fillRect(this.x * s - 1, this.y * s - 1, 2 * s, 2 * s);
    ctx.globalAlpha = 1;
  }
}

function spawnWave() {
  wave++;
  let count = 3 + wave;
  for (let i = 0; i < count; i++) {
    let edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = 0; y = Math.random() * LH; }
    else if (edge === 1) { x = LW; y = Math.random() * LH; }
    else if (edge === 2) { x = Math.random() * LW; y = 0; }
    else { x = Math.random() * LW; y = LH; }
    asteroids.push(new Asteroid(x, y, 3));
  }
}

function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('deathScreen').classList.add('hidden');
  ship = new Ship();
  asteroids = [];
  bullets = [];
  particles = [];
  score = 0;
  lives = 3;
  wave = 0;
  invincibleTimer = 2;
  shootCooldown = 0;
  document.getElementById('score').textContent = '0';
  document.getElementById('lives').textContent = '3';
  spawnWave();
  running = true;
  cancelAnimationFrame(animFrame);
  loop();
}

function loop() {
  if (!running) return;
  update();
  draw();
  animFrame = requestAnimationFrame(loop);
}

function update() {
  ship.update();
  if (invincibleTimer > 0) invincibleTimer -= 1/60;
  if (shootCooldown > 0) shootCooldown--;

  // Shooting
  if ((keys[' '] || keys['x'] || keys['X']) && shootCooldown <= 0) {
    bullets.push(new Bullet(
      ship.x + Math.cos(ship.angle) * 14,
      ship.y + Math.sin(ship.angle) * 14,
      ship.angle
    ));
    shootCooldown = 10;
  }

  // Thrust particles
  if (ship.thrusting && Math.random() > 0.4) {
    let bx = ship.x - Math.cos(ship.angle) * 8;
    let by = ship.y - Math.sin(ship.angle) * 8;
    particles.push(new Particle(bx, by, '#ff6a00'));
  }

  bullets.forEach(b => b.update());
  bullets = bullets.filter(b => b.life > 0);

  asteroids.forEach(a => a.update());

  particles.forEach(p => p.update());
  particles = particles.filter(p => p.life > 0);

  // Bullet-asteroid collisions
  for (let i = bullets.length - 1; i >= 0; i--) {
    for (let j = asteroids.length - 1; j >= 0; j--) {
      let b = bullets[i], a = asteroids[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      if (dx*dx + dy*dy < a.r * a.r) {
        // Explode
        for (let k = 0; k < 8; k++) particles.push(new Particle(a.x, a.y, 'rgba(200,200,200,0.8)'));
        // Split
        if (a.size > 1) {
          asteroids.push(new Asteroid(a.x, a.y, a.size - 1));
          asteroids.push(new Asteroid(a.x, a.y, a.size - 1));
        }
        score += [100, 50, 20][3 - a.size];
        document.getElementById('score').textContent = score;
        asteroids.splice(j, 1);
        bullets.splice(i, 1);
        break;
      }
    }
  }

  // Ship-asteroid collision
  if (invincibleTimer <= 0) {
    for (let a of asteroids) {
      let dx = ship.x - a.x, dy = ship.y - a.y;
      if (dx*dx + dy*dy < (a.r + 8) * (a.r + 8) * 0.6) {
        // Hit
        for (let k = 0; k < 15; k++) particles.push(new Particle(ship.x, ship.y, '#4488ff'));
        lives--;
        document.getElementById('lives').textContent = lives;
        if (lives <= 0) {
          gameOver();
          return;
        }
        ship.x = LW / 2;
        ship.y = LH / 2;
        ship.dx = 0;
        ship.dy = 0;
        invincibleTimer = 2.5;
        break;
      }
    }
  }

  // Next wave
  if (asteroids.length === 0) {
    spawnWave();
  }
}

function draw() {
  const s = scale;
  ctx.fillStyle = '#0d0d14';
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  for (let i = 0; i < 40; i++) {
    let sx = ((i * 137.5 + 50) % LW) * s;
    let sy = ((i * 221.3 + 30) % LH) * s;
    ctx.fillRect(sx, sy, 1, 1);
  }

  particles.forEach(p => p.draw());
  asteroids.forEach(a => a.draw());
  bullets.forEach(b => b.draw());
  ship.draw();
}

function gameOver() {
  running = false;
  cancelAnimationFrame(animFrame);
  if (score > hiScore) {
    hiScore = score;
    localStorage.setItem('asteroids_hi', hiScore);
    document.getElementById('hiscore').textContent = hiScore;
  }
  document.getElementById('finalScore').textContent = 'Score: ' + score;
  document.getElementById('deathScreen').classList.remove('hidden');
}

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// Draw initial blank
ctx.fillStyle = '#0d0d14';
ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>
</body>
</html>
