<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a2e; color: #eee; }
  .container { text-align: center; }
  h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
  .status { font-size: 1.3rem; margin-bottom: 1rem; min-height: 2rem; }
  .board { display: grid; grid-template-columns: repeat(3, 120px); grid-template-rows: repeat(3, 120px); gap: 6px; margin: 0 auto 1.5rem; }
  .cell { background: #16213e; border: none; border-radius: 8px; font-size: 3rem; font-weight: bold; color: #eee; cursor: pointer; transition: background 0.15s; }
  .cell:hover:not(.taken) { background: #0f3460; }
  .cell.x { color: #e94560; }
  .cell.o { color: #0abde3; }
  .cell.win { background: #0f3460; animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }
  button.reset { padding: 0.6rem 2rem; font-size: 1.1rem; border: none; border-radius: 6px; background: #e94560; color: #fff; cursor: pointer; }
  button.reset:hover { background: #c0392b; }
  .mode { margin-bottom: 1rem; }
  .mode button { padding: 0.4rem 1.2rem; margin: 0 0.3rem; font-size: 1rem; border: 2px solid #e94560; border-radius: 6px; background: transparent; color: #eee; cursor: pointer; }
  .mode button.active { background: #e94560; }
</style>
</head>
<body>
<div class="container">
  <h1>Tic Tac Toe</h1>
  <div class="mode">
    <button id="pvp" class="active" onclick="setMode('pvp')">2 Player</button>
    <button id="pvc" onclick="setMode('pvc')">vs Computer</button>
  </div>
  <div class="status" id="status">X's turn</div>
  <div class="board" id="board"></div>
  <button class="reset" onclick="init()">New Game</button>
</div>
<script>
const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board, turn, over, mode = 'pvp';

function setMode(m) {
  mode = m;
  document.getElementById('pvp').className = m === 'pvp' ? 'active' : '';
  document.getElementById('pvc').className = m === 'pvc' ? 'active' : '';
  init();
}

function init() {
  board = Array(9).fill('');
  turn = 'X'; over = false;
  document.getElementById('status').textContent = "X's turn";
  const container = document.getElementById('board');
  container.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const btn = document.createElement('button');
    btn.className = 'cell';
    btn.dataset.i = i;
    btn.addEventListener('click', () => play(i));
    container.appendChild(btn);
  }
}

function play(i) {
  if (over || board[i]) return;
  mark(i, turn);
  if (!over && mode === 'pvc' && turn === 'O') {
    setTimeout(aiMove, 200);
  }
}

function mark(i, player) {
  board[i] = player;
  const cell = document.querySelectorAll('.cell')[i];
  cell.textContent = player;
  cell.classList.add(player.toLowerCase(), 'taken');
  const w = checkWin(player);
  if (w) {
    over = true;
    document.getElementById('status').textContent = player + ' wins!';
    w.forEach(j => document.querySelectorAll('.cell')[j].classList.add('win'));
  } else if (board.every(c => c)) {
    over = true;
    document.getElementById('status').textContent = "It's a draw!";
  } else {
    turn = turn === 'X' ? 'O' : 'X';
    document.getElementById('status').textContent = turn + "'s turn";
  }
}

function checkWin(p) {
  return wins.find(w => w.every(i => board[i] === p)) || null;
}

function aiMove() {
  if (over) return;
  const move = bestMove();
  mark(move, 'O');
}

function bestMove() {
  // Try to win, block, or pick best spot
  for (const p of ['O','X']) {
    for (const w of wins) {
      const vals = w.map(i => board[i]);
      if (vals.filter(v => v === p).length === 2 && vals.includes('')) {
        return w[vals.indexOf('')];
      }
    }
  }
  if (!board[4]) return 4;
  const corners = [0,2,6,8].filter(i => !board[i]);
  if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
  const edges = [1,3,5,7].filter(i => !board[i]);
  return edges[Math.floor(Math.random() * edges.length)];
}

init();
</script>
</body>
</html>
